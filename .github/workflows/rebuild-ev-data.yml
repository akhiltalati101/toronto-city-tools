name: Rebuild EV data

# Periodically rebuilds the census-tract-level EV charging supply/demand/
# income dataset (scripts/build_ev_data.py) from the City of Toronto Open
# Data charging station dataset and Statistics Canada's 2021 Census, and
# publishes them as GitHub Release assets under the fixed "ev-data" tag.
# data.py downloads from that fixed URL at app startup.
#
# Runs less often than city-scorecard's rebuild-city-data.yml — charging
# station counts and census data both change slowly.

on:
  schedule:
    - cron: "0 6 1 */3 *" # quarterly, 06:00 UTC on the 1st
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-scorecard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build EV data
        run: python scripts/build_ev_data.py --out build

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ev-data --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ev-data \
              build/toronto_chargers.geoparquet \
              build/toronto_census_tracts.geoparquet \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create ev-data \
              build/toronto_chargers.geoparquet \
              build/toronto_census_tracts.geoparquet \
              --repo "$GITHUB_REPOSITORY" \
              --title "EV data" \
              --notes "Automated rebuild of EV charging supply/demand/income data. Run: ${{ github.run_id }}"
          fi
