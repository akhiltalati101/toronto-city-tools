# Fly.io config for the API (Dockerfile). One always-on machine: the street
# graphs take ~30 s to load and ~1.9 GB of RAM, so scale-to-zero would make
# the first visitor after every idle period wait.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create data --size 1 --region yyz
#   fly secrets set ALLOWED_ORIGINS=https://<your-app>.vercel.app OPENROUTER_API_KEY=...
#   fly deploy
app = "toronto-city-tools-api"
primary_region = "yyz"

[env]
  DATA_CACHE_DIR = "/data"
  RATE_LIMIT = "20/minute"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "3gb"
